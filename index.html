<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  /* ===== ASPECTUL PAGINII (CSS) ===== */
  body {
    margin: 0;
    background: #1a1a2e;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 16px 0 8px; letter-spacing: 4px; }
  .joc { display: flex; gap: 20px; align-items: flex-start; }
  canvas { background: #000; border: 2px solid #555; }
  .panou { min-width: 140px; }
  .panou p { margin: 6px 0; font-size: 18px; }
  .taste { font-size: 13px; color: #aaa; line-height: 1.6; margin-top: 16px; }
  .butoane { margin: 12px 0; display: flex; gap: 8px; }
  .butoane button {
    font-size: 22px; width: 56px; height: 56px;
    background: #333; color: #fff; border: 1px solid #666; border-radius: 8px;
  }
  #mesaj { font-size: 20px; color: #ffcc00; height: 24px; margin-top: 10px; }
</style>
</head>
<body>

<h1>TETRIS</h1>

<div class="joc">
  <!-- "canvas" = suprafața pe care desenăm, ca un framebuffer -->
  <canvas id="tabla" width="340" height="630"></canvas>

  <div class="panou">
    <p>Scor: <b id="scor">0</b></p>
    <p>Linii: <b id="linii">0</b></p>
    <p>Nivel: <b id="nivel">1</b></p>
    <p>Următoarea:</p>
    <canvas id="urmatoarea" width="120" height="120"></canvas>
    <div class="taste">
      ← → mutare<br>
      ↑ rotire<br>
      Q: oglindire<br>
      ↓ coborâre rapidă<br>
      Spațiu: cădere directă<br>
      P: pauză<br>
      Enter: joc nou
    </div>
  </div>
</div>

<div id="mesaj"></div>

<!-- Butoane pentru telefon (nu are tastatură) -->
<div class="butoane">
  <button onclick="actiune('stanga')">←</button>
  <button onclick="actiune('roteste')">⟳</button>
  <button onclick="actiune('oglinda')">⇋</button>
  <button onclick="actiune('dreapta')">→</button>
  <button onclick="actiune('jos')">↓</button>
  <button onclick="actiune('cadere')">⤓</button>
</div>

<script>
// ===== LOGICA JOCULUI (JavaScript) =====

// --- Constante ---
const COLOANE = 10;
const RANDURI = 20;
const MARIME = 30; // mărimea unui pătrățel în pixeli

// Cele 7 piese clasice, fiecare ca matrice. 0 = gol, alt număr = culoarea.
const PIESE = [
  [[1, 1, 1, 1]],             // I
  [[2, 2], [2, 2]],           // O
  [[0, 3, 0], [3, 3, 3]],     // T
  [[0, 4, 4], [4, 4, 0]],     // S
  [[5, 5, 0], [0, 5, 5]],     // Z
  [[6, 0, 0], [6, 6, 6]],     // J
  [[0, 0, 7], [7, 7, 7]],     // L
];

const CULORI = [
  null,      // 0 = gol
  '#00f0f0', // I - turcoaz
  '#f0f000', // O - galben
  '#a000f0', // T - mov
  '#00f000', // S - verde
  '#f00000', // Z - roșu
  '#0000f0', // J - albastru
  '#f0a000', // L - portocaliu
];

// --- Legătura cu elementele din pagină ---
const ctx = document.getElementById('tabla').getContext('2d');
const ctxUrm = document.getElementById('urmatoarea').getContext('2d');

// --- Starea jocului ---
let tabla;          // matrice RANDURI x COLOANE
let piesa;          // piesa curentă: { forma, x, y }
let urmatoarea;     // forma piesei următoare
let scor, linii, nivel;
let terminat, pauza;
let ultimaCadere = 0;

// Creează o tablă goală (o matrice plină cu 0)
function tablaGoala() {
  return Array.from({ length: RANDURI }, () => Array(COLOANE).fill(0));
}

// Alege o piesă la întâmplare
function formaAleatoare() {
  return PIESE[Math.floor(Math.random() * PIESE.length)];
}

// Pune următoarea piesă în joc, centrată sus
function piesaNoua() {
  const forma = urmatoarea || formaAleatoare();
  urmatoarea = formaAleatoare();
  piesa = {
    forma: forma,
    x: Math.floor((COLOANE - forma[0].length) / 2),
    y: 0,
  };
  // Dacă piesa nouă se lovește imediat de ceva, jocul s-a terminat
  if (coliziune(piesa.forma, piesa.x, piesa.y)) {
    terminat = true;
    document.getElementById('mesaj').textContent = 'GAME OVER – apasă Enter';
  }
}

// Verifică dacă o formă, pusă la (x, y), iese din tablă sau atinge alte piese
function coliziune(forma, x, y) {
  for (let r = 0; r < forma.length; r++) {
    for (let c = 0; c < forma[r].length; c++) {
      if (forma[r][c] === 0) continue;
      const tx = x + c;
      const ty = y + r;
      if (tx < 0 || tx >= COLOANE || ty >= RANDURI) return true;
      if (ty >= 0 && tabla[ty][tx] !== 0) return true;
    }
  }
  return false;
}

// Rotește o matrice cu 90° în sensul acelor de ceasornic
function roteste(forma) {
  const randuri = forma.length;
  const coloane = forma[0].length;
  const noua = [];
  for (let c = 0; c < coloane; c++) {
    noua.push([]);
    for (let r = randuri - 1; r >= 0; r--) {
      noua[c].push(forma[r][c]);
    }
  }
  return noua;
}

// Oglindește o matrice stânga-dreapta (fiecare rând citit invers)
// Exemplu: piesa S devine Z, piesa J devine L
function oglindeste(forma) {
  return forma.map(rand => [...rand].reverse());
}

// "Lipește" piesa curentă în tablă când nu mai poate coborî
function fixeazaPiesa() {
  piesa.forma.forEach((rand, r) => {
    rand.forEach((val, c) => {
      if (val !== 0) tabla[piesa.y + r][piesa.x + c] = val;
    });
  });
  scor += 5; // 5 puncte pentru fiecare piesă așezată
  stergeLinii();
  actualizeazaPanou();
  piesaNoua();
}

// Șterge rândurile complete și adaugă puncte
function stergeLinii() {
  let sterse = 0;
  for (let r = RANDURI - 1; r >= 0; r--) {
    if (tabla[r].every(val => val !== 0)) {
      tabla.splice(r, 1);                 // scoatem rândul plin
      tabla.unshift(Array(COLOANE).fill(0)); // adăugăm unul gol sus
      sterse++;
      r++; // verificăm din nou același index
    }
  }
  if (sterse > 0) {
    const puncte = [0, 100, 300, 500, 800];
    scor += puncte[sterse] * nivel;
    linii += sterse;
    nivel = Math.floor(linii / 10) + 1;
    actualizeazaPanou();
  }
}

// --- Acțiunile jucătorului ---
function actiune(ce) {
  if (terminat || pauza) return;
  if (ce === 'stanga' && !coliziune(piesa.forma, piesa.x - 1, piesa.y)) piesa.x--;
  if (ce === 'dreapta' && !coliziune(piesa.forma, piesa.x + 1, piesa.y)) piesa.x++;
  if (ce === 'jos') coboara();
  if (ce === 'roteste') {
    const rotita = roteste(piesa.forma);
    // Încercăm rotirea pe loc; dacă nu încape, încercăm puțin la stânga/dreapta
    for (const deplasare of [0, -1, 1, -2, 2]) {
      if (!coliziune(rotita, piesa.x + deplasare, piesa.y)) {
        piesa.forma = rotita;
        piesa.x += deplasare;
        break;
      }
    }
  }
  if (ce === 'oglinda') {
    const oglindita = oglindeste(piesa.forma);
    // La fel ca la rotire: dacă nu încape pe loc, încercăm puțin lateral
    for (const deplasare of [0, -1, 1]) {
      if (!coliziune(oglindita, piesa.x + deplasare, piesa.y)) {
        piesa.forma = oglindita;
        piesa.x += deplasare;
        scor -= 10; // oglindirea costă 10 puncte
        actualizeazaPanou();
        break;
      }
    }
  }
  if (ce === 'cadere') {
    while (!coliziune(piesa.forma, piesa.x, piesa.y + 1)) {
      piesa.y++;
      scor += 2;
    }
    fixeazaPiesa();
    actualizeazaPanou();
  }
  deseneaza();
}

// Coboară piesa cu un rând; dacă nu se poate, o fixează
function coboara() {
  if (!coliziune(piesa.forma, piesa.x, piesa.y + 1)) {
    piesa.y++;
  } else {
    fixeazaPiesa();
  }
}

// --- Desenare 3D ---
// Fiecare pătrățel e un cub. Îl desenăm cu o proiecție în perspectivă:
// rotim lumea cu 15° în jurul axei orizontale (camera privește puțin de sus),
// apoi împărțim la distanță (obiectele mai departe apar mai mici).

const UNGHI = 15 * Math.PI / 180; // unghiul de privire: 15 grade
const ADANCIME = 1;               // grosimea cuburilor (în pătrățele)
const DIST = 55;                  // distanța camerei față de centrul tablei
const FOCAL = MARIME * DIST;      // la distanța DIST, un pătrățel are MARIME pixeli
const CX = 170, CY = 322;         // centrul tablei pe ecran (în pixeli)

// Transformă un punct 3D (în pătrățele) în coordonate pe ecran.
// X: stânga-dreapta, Y: sus-jos, Z: în adâncime (0 = fața tablei)
function proiecteaza(X, Y, Z) {
  const y = Y * Math.cos(UNGHI) - Z * Math.sin(UNGHI); // rotire 15°
  const z = Y * Math.sin(UNGHI) + Z * Math.cos(UNGHI) + DIST;
  return { x: CX + FOCAL * X / z, y: CY + FOCAL * y / z, z: z };
}

// Deschide (f > 1) sau închide (f < 1) la culoare o culoare #rrggbb
function nuanta(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + [16, 8, 0].map(sh => {
    const v = (n >> sh) & 255;
    return Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f);
  }).join(',') + ')';
}

// Desenează un poligon dat prin puncte 3D
function poligon(puncte3D, culoare, contur) {
  const p = puncte3D.map(([X, Y, Z]) => proiecteaza(X, Y, Z));
  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.closePath();
  ctx.fillStyle = culoare;
  ctx.fill();
  if (contur) {
    ctx.strokeStyle = contur;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// Distanța medie a unei fețe față de cameră (pentru ordinea de desenare)
function distantaMedie(puncte3D) {
  return puncte3D.reduce((s, [X, Y, Z]) => s + proiecteaza(X, Y, Z).z, 0) / puncte3D.length;
}

function deseneaza() {
  const W = COLOANE / 2, H = RANDURI / 2, D = ADANCIME;

  // Fundal
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  // "Cutia" în care cad piesele: peretele din spate, pereții laterali, podeaua
  poligon([[-W, -H, D], [W, -H, D], [W, H, D], [-W, H, D]], '#15152a');
  poligon([[-W, -H, 0], [-W, -H, D], [-W, H, D], [-W, H, 0]], '#202040');
  poligon([[W, -H, 0], [W, -H, D], [W, H, D], [W, H, 0]], '#202040');
  poligon([[-W, H, 0], [W, H, 0], [W, H, D], [-W, H, D]], '#2a2a50');

  // Grila de pe peretele din spate
  ctx.strokeStyle = '#22223d';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLOANE; c++) {
    const a = proiecteaza(c - W, -H, D), b = proiecteaza(c - W, H, D);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let r = 1; r < RANDURI; r++) {
    const a = proiecteaza(-W, r - H, D), b = proiecteaza(W, r - H, D);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // Punem laolaltă piesele căzute și piesa curentă într-o singură grilă
  const grila = tabla.map(rand => [...rand]);
  piesa.forma.forEach((rand, r) => {
    rand.forEach((val, c) => {
      const ty = piesa.y + r, tx = piesa.x + c;
      if (val !== 0 && ty >= 0) grila[ty][tx] = val;
    });
  });
  const ocupat = (r, c) => r >= 0 && r < RANDURI && c >= 0 && c < COLOANE && grila[r][c] !== 0;

  // Strângem fețele vizibile ale cuburilor. Desenăm doar fețele care nu
  // sunt lipite de alt cub (cele lipite oricum nu s-ar vedea).
  const fete = [];   // fețele de sus și laterale
  const fata = [];   // fețele din față (mereu cele mai apropiate de cameră)
  for (let r = 0; r < RANDURI; r++) {
    for (let c = 0; c < COLOANE; c++) {
      if (!ocupat(r, c)) continue;
      const culoare = CULORI[grila[r][c]];
      const x0 = c - W, x1 = x0 + 1, y0 = r - H, y1 = y0 + 1;

      if (!ocupat(r - 1, c)) // fața de sus: cea mai luminată
        fete.push({ p: [[x0, y0, 0], [x1, y0, 0], [x1, y0, D], [x0, y0, D]], cul: nuanta(culoare, 1.45) });
      if (x0 > 0 && !ocupat(r, c - 1)) // latura stângă (se vede în jumătatea dreaptă)
        fete.push({ p: [[x0, y0, 0], [x0, y1, 0], [x0, y1, D], [x0, y0, D]], cul: nuanta(culoare, 0.55) });
      if (x1 < 0 && !ocupat(r, c + 1)) // latura dreaptă (se vede în jumătatea stângă)
        fete.push({ p: [[x1, y0, 0], [x1, y1, 0], [x1, y1, D], [x1, y0, D]], cul: nuanta(culoare, 0.55) });

      fata.push({ p: [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]], cul: culoare });
    }
  }

  // "Algoritmul pictorului": desenăm întâi ce e departe, apoi ce e aproape
  fete.sort((a, b) => distantaMedie(b.p) - distantaMedie(a.p));
  fete.forEach(f => poligon(f.p, f.cul, 'rgba(0,0,0,0.35)'));
  fata.forEach(f => {
    // Gradient: mai luminos sus, mai închis jos, ca lumina să pară că vine de sus
    const sus = proiecteaza(f.p[0][0], f.p[0][1], 0), jos = proiecteaza(f.p[2][0], f.p[2][1], 0);
    const g = ctx.createLinearGradient(sus.x, sus.y, jos.x, jos.y);
    g.addColorStop(0, nuanta(f.cul, 1.25));
    g.addColorStop(1, nuanta(f.cul, 0.8));
    poligon(f.p, g, nuanta(f.cul, 0.5));
  });

  // Piesa următoare, în panoul din dreapta: cuburi mici, desenate simplu
  ctxUrm.fillStyle = '#0d0d1a';
  ctxUrm.fillRect(0, 0, 120, 120);
  const s = 22, ad = 6; // mărimea și grosimea cuburilor mici
  // rândurile de jos în sus, ca un cub de deasupra să acopere corect pe cel de dedesubt
  for (let r = urmatoarea.length - 1; r >= 0; r--) {
    urmatoarea[r].forEach((val, c) => {
      if (val === 0) return;
      const x = 14 + c * s, y = 34 + r * s, col = CULORI[val];
      const fataMica = (pts, cul) => {
        ctxUrm.beginPath();
        ctxUrm.moveTo(pts[0][0], pts[0][1]);
        pts.slice(1).forEach(([px, py]) => ctxUrm.lineTo(px, py));
        ctxUrm.closePath();
        ctxUrm.fillStyle = cul; ctxUrm.fill();
        ctxUrm.strokeStyle = 'rgba(0,0,0,0.4)'; ctxUrm.stroke();
      };
      fataMica([[x, y], [x + s, y], [x + s + ad, y - ad], [x + ad, y - ad]], nuanta(col, 1.45));         // sus
      fataMica([[x + s, y], [x + s + ad, y - ad], [x + s + ad, y + s - ad], [x + s, y + s]], nuanta(col, 0.55)); // dreapta
      fataMica([[x, y], [x + s, y], [x + s, y + s], [x, y + s]], col);                                      // față
    });
  }
}

function actualizeazaPanou() {
  document.getElementById('scor').textContent = scor;
  document.getElementById('linii').textContent = linii;
  document.getElementById('nivel').textContent = nivel;
}

// --- Bucla principală a jocului ---
// Browserul cheamă funcția asta de ~60 de ori pe secundă
function bucla(timp) {
  const viteza = Math.max(100, 800 - (nivel - 1) * 70); // ms între căderi
  if (!terminat && !pauza && timp - ultimaCadere > viteza) {
    coboara();
    ultimaCadere = timp;
    deseneaza();
  }
  requestAnimationFrame(bucla);
}

// --- Tastatura ---
document.addEventListener('keydown', (e) => {
  const taste = {
    ArrowLeft: 'stanga',
    ArrowRight: 'dreapta',
    ArrowDown: 'jos',
    ArrowUp: 'roteste',
    ' ': 'cadere',
    q: 'oglinda',
    Q: 'oglinda',
  };
  if (taste[e.key]) {
    e.preventDefault(); // ca pagina să nu facă scroll
    actiune(taste[e.key]);
  }
  if (e.key === 'p' || e.key === 'P') {
    if (terminat) return;
    pauza = !pauza;
    document.getElementById('mesaj').textContent = pauza ? 'PAUZĂ' : '';
  }
  if (e.key === 'Enter' && terminat) jocNou();
});

// --- Pornirea ---
function jocNou() {
  tabla = tablaGoala();
  scor = 0; linii = 0; nivel = 1;
  terminat = false; pauza = false;
  urmatoarea = null;
  document.getElementById('mesaj').textContent = '';
  piesaNoua();
  actualizeazaPanou();
  deseneaza();
}

jocNou();
requestAnimationFrame(bucla);
</script>

</body>
</html>
